<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../styles/main.css" /></head>
<body>
<script src="../scripts/theory-page.js"></script>
<script>
renderTheory({
  title: "Reduction of iron(III) oxide by carbon monoxide",
  subtitle: "Smelting iron from its oxide ore",
  lede: "Hot carbon monoxide gas removes oxygen from rust-coloured Fe₂O₃, leaving silvery elemental iron. This is the laboratory analogue of a blast furnace.",
  diagram: `
    <svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1a253f"/><stop offset="1" stop-color="#0e1530"/></linearGradient></defs>
      <rect width="700" height="220" fill="url(#g1)"/>
      <!-- CO generator (left) -->
      <rect x="30" y="100" width="100" height="80" rx="6" fill="rgba(120,170,255,.1)" stroke="#9ec2ff" stroke-width="2"/>
      <text x="36" y="92" fill="#9ec2ff" font-size="12">CO generator</text>
      <text x="60" y="148" fill="#fff" font-size="14">CO(g)</text>
      <!-- Wash bottle -->
      <rect x="170" y="110" width="80" height="70" fill="rgba(120,170,255,.08)" stroke="#9ec2ff"/>
      <text x="174" y="102" fill="#9ec2ff" font-size="11">drying agent</text>
      <!-- Combustion tube -->
      <rect x="290" y="80" width="280" height="40" fill="rgba(255,150,80,.18)" stroke="#9ec2ff" stroke-width="2"/>
      <rect x="380" y="90" width="100" height="20" fill="#a83824"/>
      <text x="395" y="105" fill="#fff" font-size="12">Fe₂O₃ → Fe</text>
      <text x="290" y="74" fill="#9ec2ff" font-size="11">heated combustion tube</text>
      <!-- Flame -->
      <ellipse cx="430" cy="140" rx="22" ry="14" fill="rgba(255,170,60,.7)"/>
      <ellipse cx="430" cy="140" rx="10" ry="6" fill="rgba(120,200,255,.85)"/>
      <!-- Limewater on right -->
      <rect x="600" y="120" width="60" height="60" fill="rgba(220,235,255,.4)" stroke="#9ec2ff"/>
      <text x="600" y="112" fill="#9ec2ff" font-size="11">limewater</text>
      <!-- Connecting tubes -->
      <path d="M130 140 L170 140 M250 140 L290 100 M570 100 L600 130" stroke="#9ec2ff" stroke-width="2" fill="none"/>
      <!-- Burner -->
      <rect x="415" y="170" width="30" height="6" fill="#42537b"/>
    </svg>`,
  sections: [
    { heading: "Reactions",
      formula: "3 CO + Fe₂O₃ &nbsp;→&nbsp; 2 Fe + 3 CO₂<br>CO₂ + Ca(OH)₂ &nbsp;→&nbsp; CaCO₃↓ + H₂O",
      body: "Pass dry CO through the heated combustion tube. The reddish-brown Fe₂O₃ slowly turns silvery-grey as it is reduced to iron. The exhaust gas CO₂ then turns limewater milky in the wash bottle, confirming the reaction." },
    { heading: "Why dry the CO first?",
      body: "Water vapour would condense in the cool ends of the combustion tube and could shatter the hot glass. A small drying tube of CaCl₂ or concentrated H₂SO₄ removes the moisture." },
    { heading: "Safety controls",
      list: [
        "CO is extremely toxic — pass the exhaust through a burner that ignites unreacted CO to harmless CO₂.",
        "Vent the whole setup inside a fume cupboard.",
        "Keep the CO stream flowing for a minute after switching off the burner, so the hot iron does not re-oxidise in air."
      ] }
  ],
  aside: [
    "This experiment models the industrial blast furnace, where coke first burns to CO₂ and then reduces to CO, which goes on to reduce Fe₂O₃ at temperatures around 700 – 900 °C in the upper zone of the furnace.",
    "The same chemistry powered the iron age — early furnaces used charcoal both as the reducing agent and to supply the necessary heat."
  ],
  questions: [
    "Why does the reaction need to be carried out in a stream of CO rather than a sealed tube?",
    "Predict whether H₂ could replace CO in this setup, and write the balanced equation.",
    "What is the role of the second flame at the end of the apparatus?"
  ]
});
</script>
</body></html>
